# Deterministic disk assembly for the airgap live image — BOOT=grub (the default).
#
# This is the STOCK DEBIAN boot chain:
#
#   firmware ──db(Microsoft CA)──▶ BOOTX64.EFI  = Debian's MS-signed shim
#   shim     ──its embedded Debian cert──▶ grubx64.efi = Debian's SIGNED GRUB
#   GRUB     ──SHIM_LOCK protocol, back into shim──▶ vmlinuz = Debian's SIGNED kernel
#
#   p1  ESP (FAT32)    -> shim + signed GRUB + grub.cfg + kernel + initrd
#   p2  squashfs root  -> raw mksquashfs image, no containing filesystem
#
# Writes go to a tmpfs overlay at runtime (dracut `rootovl`), so nothing on the USB
# is ever written and every boot starts clean.

image efi-part.vfat {
	vfat {
		# --invariant: no timestamps/volume-id entropy in the FAT metadata.
		# -i: a FIXED volume serial, distinct per repo so two of these images
		# plugged into the same machine are never ambiguous.
		extraargs = "--invariant -i A14BA900"

		file EFI/BOOT/BOOTX64.EFI {
			image = "shimx64.efi"
		}
		file EFI/BOOT/grubx64.efi {
			image = "grubx64.efi"
		}
		file EFI/BOOT/mmx64.efi {
			image = "mmx64.efi"
		}
		file EFI/debian/grub.cfg {
			image = "grub.cfg"
		}
		file vmlinuz {
			image = "vmlinuz"
		}
		file initrd.img {
			image = "initrd.img"
		}
	}
	size = 131072K
}

image airgap.img {
	hdimage {
		disk-uuid = 5c3f5d4f-0000-4000-8000-000000000001
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		partition-uuid = 5c3f5d4f-0000-4000-8000-000000000002
		offset = 32K
		bootable = true
	}

	partition root {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = 5c3f5d4f-0000-4000-8000-000000000003
		image = "rootfs.squashfs"
	}
}
