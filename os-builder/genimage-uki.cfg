# Deterministic disk assembly for the airgap live image (UEFI-only, BOOT=uki).
#
#   p1  ESP (FAT32)      -> EFI/BOOT/BOOTX64.EFI = Debian's MS-signed shim
#                           EFI/BOOT/grubx64.efi = OUR UKI (shim's 2nd-stage name)
#   p2  squashfs root    -> raw mksquashfs image, no containing filesystem
#
# Writes go to a tmpfs overlay at runtime (dracut `rootovl`), so nothing on the
# USB is ever written and every boot starts clean.

image efi-part.vfat {
	vfat {
		extraargs = "--invariant -i A14BA900"

		file EFI/BOOT/BOOTX64.EFI {
			image = "shimx64.efi"
		}
		file EFI/BOOT/grubx64.efi {
			image = "BOOTX64.EFI"
		}
		file EFI/BOOT/mmx64.efi {
			image = "mmx64.efi"
		}
		file EFI/airgap.der {
			image = "airgap.der"
		}
	}
	size = 131072K
}

image airgap.img {
	hdimage {
		disk-uuid = 5c3f5d4f-0000-4000-8000-000000000001
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		partition-uuid = 5c3f5d4f-0000-4000-8000-000000000002
		offset = 32K
		bootable = true
	}

	partition root {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = 5c3f5d4f-0000-4000-8000-000000000003
		image = "rootfs.squashfs"
	}
}
