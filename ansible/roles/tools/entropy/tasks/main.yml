---
# haveged/rng-tools5/apparmor-utils are hash-locked in
# os-builder/airgap-rootfs-packages.list. infnoise is too — the Debian
# package ships the driver, its own systemd unit and udev rules, replacing
# the old git-clone + compile of waywardgeek/infnoise this role used to do
# at provision time (pinned commit 66075cc, `make -f Makefile.linux`).

- name: Apparmor / Systemd Haveged Permissions Fix
  block:
  - lineinfile:
      dest: /etc/apparmor.d/local/usr.sbin.haveged
      state: present
      insertafter: EOF
      line: '  /fsprotect/system/lib/x86_64-linux-gnu/libc-*.so r,'
  - lineinfile:
      dest: /etc/apparmor.d/local/usr.sbin.haveged
      state: present
      insertafter: EOF
      line: '  /fsprotect/system/usr/lib/x86_64-linux-gnu/libhavege.so.* r,'
  - lineinfile:
      dest: /etc/apparmor.d/local/usr.sbin.haveged
      state: present
      insertafter: EOF
      line: '  /fsprotect/system/usr/lib/x86_64-linux-gnu/libc*.so r,'
  - lineinfile:
      path: /lib/systemd/system/haveged.service
      regexp: 'PrivateTmp=yes'
      line: ''
  - lineinfile:
      path: /lib/systemd/system/haveged.service
      regexp: 'PrivateDevices=yes'
      line: ''
  - lineinfile:
      path: /lib/systemd/system/haveged.service
      regexp: 'ProtectSystem=full'
      line: ''
  - lineinfile:
      path: /lib/systemd/system/haveged.service
      regexp: 'ProtectHome=yes'
      line: ''

- systemd: name=haveged enabled=yes masked=no

- name: Infinite Noise TRNG
  # The `infnoise` package provides /usr/sbin/infnoise plus its own
  # infnoise.service and udev rules. Just enable it.
  systemd:
    name: infnoise
    enabled: yes
    masked: no
