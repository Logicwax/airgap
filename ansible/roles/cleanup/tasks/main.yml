---
# Do not apt-get update / install / autoremove here. That hits the live
# mirrors, rewrites /var/lib/dpkg, and is the opposite of a locked rootfs.
# Package adds belong in os-builder/airgap-rootfs-packages.list + `make
# rootfs-update`.

- name: Cleanup cruft files
  file:
    state: absent
    path: "{{ item }}"
  loop:
    - /var/cache/apt/
    - /var/cache/debconf/
    - /var/lib/apt/
    - /var/log/
    - /usr/share/doc/
    - /root/.ansible
    - /root/.cache
    - /home/{{ user }}/.ansible
    - /home/{{ user }}/.cache

- name: Recreate APT required directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /var/lib/apt/lists/partial
    - /var/cache/apt/archives/partial

- name: Recreate /var/log
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /var/log
    - /var/log/apt
    - /var/log/private
