---
# APT packages are hash-locked in os-builder/airgap-rootfs-packages.list.
# Do not apt-get or add live apt sources here.

- name: Create user
  block:
  - user:
      name: "{{ user }}"
      shell: /bin/bash
      groups: sudo,operator
      createhome: true
      append: yes
  - file:
      path: "/home/{{ user }}/"
      state: directory
      recurse: yes
      owner: "{{ user }}"
      group: "{{ user }}"
  - file:
      path: "/home/{{ user }}/.local/bin"
      state: directory
      owner: "{{ user }}"
      group: "{{ user }}"
      mode: "0755"
  - name: Delete user account passwd
    shell: "passwd --delete {{ user }}"
  - name: Enabling password-less sudo for operators group
    lineinfile:
      dest: /etc/sudoers
      state: present
      line: '%operator ALL=(ALL) NOPASSWD: ALL'
  - file:
      path: "/home/{{ user }}/.bash_profile"
      state: touch
      owner: "{{ user }}"
      group: "{{ user }}"
      mode: "0755"
  - blockinfile:
      dest: "/home/{{ user }}/.bash_profile"
      state: present
      block: |
        clear
        export PATH="/home/{{ user }}/.local/bin:$PATH"
        export GPG_TTY=$(tty)
        alias bigfont="setfont /usr/share/consolefonts/Lat2-Terminus28x14.psf.gz"
        alias ls="ls --color=auto"
        alias grep="grep --color=auto"
        alias ll="ls -alhF"
        alias help="/etc/update-motd.d/100-timecheck"
        PS1='${debian_chroot:+($debian_chroot)}\[\033[32m\]\u\[\033[00m\]@\[\033[01;32m\]\h\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]\$ '
        alias yubireset="rm -rfv ~/.gnupg/private-keys-v1.d && sudo killall -q -s 9 gpg-agent ssh-agent scdaemon pcscd || true && rm -f '~/.gnupg/*.lock' && source ~/.bash_profile && gpg --card-status"

- name: Z-shell
  block:
  - blockinfile:
      dest: "/home/{{ user }}/.zshrc"
      create: yes
      owner: "{{ user }}"
      group: "{{ user }}"
      mode: "0644"
      state: present
      block: |
        export PATH="/home/{{ user }}/.local/bin:/usr/sbin:$PATH"
        export GPG_TTY=$(tty)
        source /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh
        source /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
        alias bigfont="setfont /usr/share/consolefonts/Lat2-Terminus28x14.psf.gz"
        alias ls="ls --color=auto"
        alias grep="grep --color=auto"
        alias ll="ls -alFh"
        alias help="/etc/update-motd.d/100-timecheck"
        PS1='%F{magenta}%n%F{cyan}@%f%B%F{green}%m%f%b%F{white}:%f%F{blue}%B%~%b%f%F{white}%f$ '
        if [ -x /usr/bin/tput ] && tput setaf 1 >&/dev/null; then
            export TERM="xterm-256color"
        fi
        alias yubireset="rm -rfv ~/.gnupg/private-keys-v1.d && sudo killall -q -s 9 gpg-agent ssh-agent scdaemon pcscd || true && rm -f '~/.gnupg/*.lock' && source ~/.zshrc && gpg --card-status"
        HISTFILE=~/.zsh_history
        HISTSIZE=10000
        SAVEHIST=10000
        setopt appendhistory
  - shell: chsh -s $(which zsh) {{ user }}

- name: Automatic Local Login
  block:
  - file:
      path: /etc/systemd/system/getty@tty1.service.d
      state: directory
      owner: root
      group: root
      mode: "0755"
  - template:
      src: autologin.conf
      dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
      owner: root
      group: root
      mode: "0644"
  - systemd: name=getty@tty1 enabled=yes masked=no

- name: Auto Mount SD Cards
  block:
    - template:
        src: udev-sdcard-automount.rules
        dest: /etc/udev/rules.d/70-udev-sdcard-automount.rules
    - file:
        path: /etc/systemd/system/systemd-udevd.service.d/
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Allow systemd-udevd to mount to the system filesystem namespace
      template:
        src: shared-mount.conf
        dest: /etc/systemd/system/systemd-udevd.service.d/shared-mount.conf

- name: Media Automount
  template:
    src: media-automount
    dest: /usr/local/bin/media-automount
    mode: "0755"

- name: Media Automount Service
  template:
    src: media-automount@.service
    dest: /etc/systemd/system/media-automount@.service
    mode: "0644"

# systemd isn't available in debian's initramfs-tools, so we use dracut.
# This is what actually gives the booted image `rootovl` (read-only
# squashfs root + tmpfs overlay reset on every reboot) — build-os.sh's
# genimage/ukify boot chain assembly depends on the initramfs dracut
# produces here.
- name: Read-only overlay
  block:
  - lineinfile:
      dest: /etc/dracut.conf.d/overlay.conf
      create: yes
      insertafter: EOF
      line: 'filesystems+=" overlay "'
  - lineinfile:
      dest: /etc/dracut.conf.d/udev.conf
      create: yes
      insertafter: EOF
      line: 'filesystems+=" ext4 squashfs "'
  - lineinfile:
      dest: /etc/dracut.conf.d/10-debian.conf
      create: yes
      regexp: "hostonly=yes"
      line: "hostonly=no"
  - lineinfile:
      dest: /etc/dracut.conf.d/20-reproducible.conf
      create: yes
      insertafter: EOF
      line: 'reproducible=yes'
  - shell: dracut --regenerate-all --force
    environment:
      SOURCE_DATE_EPOCH: "1"
  become: yes

- name: Remove stock CD-ROM fstab entry
  lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+/media/cdrom[0-9]*\s'
    state: absent

- name: Find stock CD-ROM mountpoints and symlinks
  find:
    paths: /media
    patterns:
      - cdrom
      - 'cdrom[0-9]*'
    file_type: any
  register: stock_cdrom

- name: Remove stock CD-ROM mountpoints and symlinks
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ stock_cdrom.files }}"

- name: Airgap MOTD timedrift warning
  block:
  - template:
      src: timecheck-motd.sh
      dest: /etc/update-motd.d/100-timecheck
      mode: "0755"
  - file:
      path: /etc/motd
      state: absent

- name: Support right-button clipboard pasting
  lineinfile:
    dest: /etc/default/consolation
    create: yes
    regexp: 'DAEMON_OPTS=""'
    line: 'DAEMON_OPTS="--map BTN_RIGHT=paste"'
